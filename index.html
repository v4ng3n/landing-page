<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1020">
  <title>V4NG3N</title>
  <style>
    :root {
      --bg: #090d18;
      --panel: rgba(255,255,255,.065);
      --panel-hover: rgba(255,255,255,.105);
      --border: rgba(255,255,255,.11);
      --text: #f5f7fb;
      --muted: #929bb0;
      --accent: #7c9cff;
      --shadow: 0 22px 60px rgba(0,0,0,.32);
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
                   "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 18% 10%, rgba(85, 114, 255, .20), transparent 32rem),
        radial-gradient(circle at 82% 90%, rgba(32, 197, 143, .13), transparent 30rem),
        var(--bg);
      display: grid;
      place-items: center;
      padding: 32px 20px;
    }

    main {
      width: min(920px, 100%);
    }

    header {
      margin-bottom: 36px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .mark {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      font-weight: 800;
      letter-spacing: -.04em;
      background: linear-gradient(145deg, #7797ff, #5067dc);
      box-shadow: 0 10px 30px rgba(84, 109, 223, .35);
    }

    h1 {
      margin: 0;
      font-size: clamp(2.3rem, 7vw, 4.8rem);
      line-height: .96;
      letter-spacing: -.065em;
      font-weight: 800;
    }

    .subtitle {
      margin: 15px 0 0;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.6;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .card {
      position: relative;
      overflow: hidden;
      min-height: 220px;
      padding: 26px;
      border-radius: 24px;
      border: 1px solid var(--border);
      background: var(--panel);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: var(--shadow);
      color: inherit;
      text-decoration: none;
      transition: transform .18s ease, background .18s ease, border-color .18s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      background: var(--panel-hover);
      border-color: rgba(255,255,255,.20);
    }

    .card:focus-visible {
      outline: 3px solid rgba(124,156,255,.7);
      outline-offset: 3px;
    }

    .icon {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      margin-bottom: 36px;
      font-size: 25px;
      background: rgba(255,255,255,.09);
      border: 1px solid rgba(255,255,255,.08);
    }

    .card h2 {
      margin: 0;
      font-size: 1.45rem;
      letter-spacing: -.025em;
    }

    .card p {
      margin: 8px 36px 0 0;
      color: var(--muted);
      line-height: 1.55;
    }

    .arrow {
      position: absolute;
      right: 23px;
      bottom: 23px;
      font-size: 23px;
      color: #c9d2ea;
      transition: transform .18s ease;
    }

    .card:hover .arrow {
      transform: translate(3px, -3px);
    }

    .food::after,
    .home::after {
      content: "";
      position: absolute;
      width: 190px;
      height: 190px;
      border-radius: 999px;
      right: -95px;
      top: -90px;
      filter: blur(3px);
      opacity: .34;
      pointer-events: none;
    }

    .food::after { background: #22c58f; }
    .home::after { background: #6f88ff; }

    footer {
      margin-top: 28px;
      color: #616a7f;
      font-size: .88rem;
    }

    @media (max-width: 650px) {
      body { align-items: start; padding-top: 54px; }
      .grid { grid-template-columns: 1fr; }
      .card { min-height: 185px; }
      .icon { margin-bottom: 25px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .card, .arrow { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="brand">
        <div class="mark">V</div>
      </div>
      <h1>V4NG3N</h1>
      <p class="subtitle">Et lille hjem på nettet.</p>
    </header>

    <section class="grid" aria-label="Tjenester">
      <a class="card food" href="https://madplan.v4ng3n.xyz">
        <div class="icon" aria-hidden="true">🍽️</div>
        <h2>Madplan</h2>
        <p>Ugens madplan, opskrifter og indkøbsliste.</p>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>

      <a class="card home" href="https://homeassistant.v4ng3n.xyz">
        <div class="icon" aria-hidden="true">⌂</div>
        <h2>Home Assistant</h2>
        <p>Styring og overblik over hjemmet.</p>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>
    </section>

    <footer>v4ng3n.xyz</footer>
  </main>
</body>
</html>
